<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Arr Import Solver — decisions</title>
    <style>
        :root {
            --bg: #14161a;
            --panel: #1d2026;
            --border: #2c313b;
            --text: #d7dbe2;
            --muted: #8b93a3;
            --accent: #4c9aff;
            --ok: #3fb96a;
            --warn: #e0a13a;
            --err: #d95b5b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
        }
        header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 16px;
        }
        h1 { font-size: 18px; margin: 0; font-weight: 600; }
        #status { color: var(--muted); font-size: 12px; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        th {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
            background: #191c22;
        }
        tr:last-child td { border-bottom: none; }
        td.time { white-space: nowrap; color: var(--muted); }
        td.file { max-width: 340px; overflow-wrap: anywhere; }
        .badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .b-Import { background: rgba(63, 185, 106, .15); color: var(--ok); }
        .b-RejectBlock { background: rgba(217, 91, 91, .15); color: var(--err); }
        .b-Skip { background: rgba(139, 147, 163, .15); color: var(--muted); }
        .b-LeaveToHuman { background: rgba(224, 161, 58, .15); color: var(--warn); }
        .s-Applied { color: var(--ok); }
        .s-Done { color: var(--ok); }
        .s-SkippedDryRun { color: var(--warn); }
        .s-Failed { color: var(--err); }
        .s-Pending { color: var(--muted); }
        .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
        .error { color: var(--err); overflow-wrap: anywhere; max-width: 320px; }
        #empty { color: var(--muted); padding: 24px; text-align: center; }
        .q-detail td { background: #191c22; padding: 12px 16px; }
        .q-detail pre {
            margin: 4px 0 0;
            font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: var(--muted);
            max-height: 260px;
            overflow: auto;
        }
        .qbtn {
            background: var(--panel);
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 26px;
            height: 24px;
            cursor: pointer;
            font-weight: 700;
        }
        .qbtn:hover { border-color: var(--accent); }
    </style>
</head>
<body>
<header>
    <h1>Arr Import Solver — decisions</h1>
    <span id="status">loading…</span>
    <label style="margin-left:auto; color: var(--muted)">Items
        <select id="limit" style="background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px;">
            <option value="200">200</option>
            <option value="500" selected>500</option>
            <option value="1000">1000</option>
            <option value="0">All</option>
        </select>
    </label>
</header>

<table>
    <thead>
    <tr>
        <th>Time (UTC)</th>
        <th>File</th>
        <th>Chosen</th>
        <th>Resolver</th>
        <th>Confidence</th>
        <th>Action</th>
        <th>Status</th>
        <th>Error</th>
        <th title="Question sent to the model">Q</th>
    </tr>
    </thead>
    <tbody id="rows"></tbody>
</table>
<div id="empty" hidden>No decisions recorded yet.</div>

<script>
    const rowsEl = document.getElementById("rows");
    const emptyEl = document.getElementById("empty");
    const statusEl = document.getElementById("status");
    const limitEl = document.getElementById("limit");

    let limit = Number(limitEl.value);

    limitEl.addEventListener("change", () => {
        limit = Number(limitEl.value);
        refresh();
    });

    async function refresh() {
        try {
            const res = await fetch("/api/decisions?limit=" + limit);
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            render(data);
            const shown = limit > 0 ? Math.min(data.length, limit) : data.length;
            statusEl.textContent = `${shown} decision${shown === 1 ? "" : "s"} · updated ${new Date().toLocaleTimeString()}`;
        } catch (err) {
            statusEl.textContent = "refresh failed: " + err.message;
        }
    }

    function badge(cls, text) {
        return `<span class="badge ${cls}">${text}</span>`;
    }

    function prettyJson(text) {
        if (!text) return "";
        try {
            text = JSON.stringify(JSON.parse(text), null, 2);
        } catch (_) {
            // keep raw text if it is not valid JSON
        }
        return esc(text);
    }

    const openQs = new Set();

    function toggleQ(id) {
        if (openQs.has(id)) openQs.delete(id);
        else openQs.add(id);
        applyQS(id);
    }

    function applyQS(id) {
        const detail = document.getElementById("q-" + id);
        const btn = document.getElementById("qbtn-" + id);
        if (!detail) return;
        const show = openQs.has(id);
        detail.hidden = !show;
        if (btn) btn.textContent = show ? "–" : "?";
    }

    function render(data) {
        emptyEl.hidden = data.length !== 0;
        rowsEl.innerHTML = data.map(rec => {
            const confidence = rec.confidence != null ? (rec.confidence * 100).toFixed(1) + "%" : "—";
            const err = rec.error || "";
            const hasQ = !!(rec.questions && rec.questions.trim());
            const row = `<tr id="d-${rec.id}">
                <td class="time">${rec.utcTimestamp ? new Date(rec.utcTimestamp).toISOString().slice(0, 19).replace("T", " ") : ""}</td>
                <td class="file mono">${esc(rec.fileName || "")}</td>
                <td>${esc(rec.chosen || "")}</td>
                <td>${esc(rec.resolver || "")}</td>
                <td>${confidence}</td>
                <td>${badge("b-" + rec.action, esc(rec.action || ""))}</td>
                <td><span class="s-${rec.status}">${esc(rec.status || "")}</span></td>
                <td class="error">${esc(err)}</td>
                <td>${hasQ
                    ? `<button type="button" class="qbtn" id="qbtn-${rec.id}" onclick="toggleQ(${rec.id})" title="Show question sent to the model">?</button>`
                    : ""}</td>
            </tr>`;
            const detail = hasQ
                ? `<tr class="q-detail" id="q-${rec.id}" hidden><td colspan="9"><strong>Question sent to the model</strong><pre>${prettyJson(rec.questions)}</pre></td></tr>`
                : "";
            return row + detail;
        }).join("");
        openQs.forEach(applyQS);
    }

    function esc(s) {
        return (s || "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
    }

    refresh();
    setInterval(refresh, 10000);
</script>
</body>
</html>
