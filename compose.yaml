services:
  arrimportsolver:
    image: arrimportsolver
    build:
      context: .
      dockerfile: ArrImportSolver/Dockerfile
    depends_on:
      - sidecar
    environment:
      Lidarr__Url: ${LIDARR_URL:?set LIDARR_URL}
      Lidarr__Key: ${LIDARR_KEY:?set LIDARR_KEY}
      Lidarr__DryRun: ${LIDARR_DRYRUN:-true}
      Lidarr__PollIntervalSeconds: ${LIDARR_POLL_INTERVAL:-60}
      Lidarr__SidecarUrl: http://sidecar:8000
      Lidarr__SidecarReadyTimeoutSeconds: ${LIDARR_SIDECAR_READY_TIMEOUT:-900}
      Lidarr__Model__MinConfidence: ${LIDARR_MIN_CONFIDENCE:-0.70}
      Lidarr__Model__MaxMappingOptions: ${LIDARR_MAX_MAPPING_OPTIONS:-16}
      Ui__Port: "8080"
    ports:
      - "${UI_PORT:-8080}:8080"
    volumes:
      - decisions-data:/app/data

  sidecar:
    image: sidecar
    build:
      context: LayaSidecar
      dockerfile: Dockerfile
    environment:
      DECISION_ENGINE: ${DECISION_ENGINE:-laya}
      # laya backend (default): parallel small model, calibrated confidence.
      LAYA_MODEL: ${LAYA_MODEL:-typed-decisions}
      LAYA_DEVICE: ${LAYA_DEVICE:-auto}
      LAYA_PRELOAD: ${LAYA_PRELOAD:-}
      LAYA_CHUNK_SIZE: ${LAYA_CHUNK_SIZE:-5}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${SIDECAR_PORT:-8000}:8000"
    volumes:
      - model-cache:/root/.cache/huggingface

volumes:
  decisions-data:
  model-cache: