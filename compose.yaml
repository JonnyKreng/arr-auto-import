services:
  arrimportsolver:
    image: arrimportsolver
    build:
      context: .
      dockerfile: ArrImportSolver/Dockerfile
    environment:
      Lidarr__Url: ${LIDARR_URL:?set LIDARR_URL}
      Lidarr__Key: ${LIDARR_KEY:?set LIDARR_KEY}
      Lidarr__DryRun: ${LIDARR_DRYRUN:-true}
      Lidarr__PollIntervalSeconds: ${LIDARR_POLL_INTERVAL:-20}
      Lidarr__Llm__Url: ${LLM_URL:-}
      Lidarr__Llm__ApiKey: ${LLM_API_KEY:-}
      Lidarr__Llm__Model: ${LLM_MODEL:-}
      Lidarr__Llm__MaxTokens: ${LLM_MAX_TOKENS:-4096}
      Lidarr__Llm__TimeoutSeconds: ${LLM_TIMEOUT:-600}
      Lidarr__Llm__MaxRetries: ${LLM_MAX_RETRIES:-3}
      Lidarr__Llm__RetryDelaySeconds: ${LLM_RETRY_DELAY:-5}
      Lidarr__Model__MinConfidence: ${LIDARR_MIN_CONFIDENCE:-0.70}
      Lidarr__Model__MaxMappingOptions: ${LIDARR_MAX_MAPPING_OPTIONS:-16}
      Ui__Port: "8080"
    ports:
      - "${UI_PORT:-8080}:8080"
    volumes:
      - decisions-data:/app/data

volumes:
  decisions-data: